services:
  glas-intelligence:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samjmc}/glas-intelligence:${DEPLOY_TAG:-latest}
    container_name: glas-intelligence
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: glas-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samjmc}/glas-intelligence:${DEPLOY_TAG:-latest}
    container_name: glas-celery-worker
    command: /app/backend/.venv/bin/celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=celery
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    stop_grace_period: 1200s
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - redis

  celery-sim-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samjmc}/glas-intelligence:${DEPLOY_TAG:-latest}
    container_name: glas-sim-worker
    command: /app/backend/.venv/bin/celery -A app.celery_app worker --loglevel=info --concurrency=1 --queues=simulation -n sim@%h
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    stop_grace_period: 1200s
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - redis

  celery-research-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samjmc}/glas-intelligence:${DEPLOY_TAG:-latest}
    container_name: glas-research-worker
    command: /app/backend/.venv/bin/celery -A app.celery_app worker --loglevel=info --concurrency=1 --queues=research -n research@%h
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    stop_grace_period: 1200s
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - redis

  celery-beat:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-samjmc}/glas-intelligence:${DEPLOY_TAG:-latest}
    container_name: glas-celery-beat
    command: /app/backend/.venv/bin/celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis_data:
