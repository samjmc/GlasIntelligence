services:
  glas-intelligence:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: glas-intelligence
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: glas-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: glas-celery-worker
    command: /app/backend/.venv/bin/celery -A app.celery_app worker --loglevel=info --concurrency=2
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      - redis

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: glas-celery-beat
    command: /app/backend/.venv/bin/celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis_data:
