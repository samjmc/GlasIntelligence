# Template for /opt/glas/deploy/app-secrets.conf on the server (KEY=VALUE, no quotes,
# no spaces around "="). That file is created by bootstrap-server.sh with chmod 600 and is
# never committed. Fill the empty values with deploy/push-secrets.ps1 (run on your PC) or
# by editing the file on the server.

# --- Address --------------------------------------------------------------------
APP_DOMAIN=app.glasinsight.com
# Let's Encrypt sends certificate-expiry warnings here.
ACME_EMAIL=
CORS_ORIGINS=https://app.glasinsight.com
FRONTEND_URL=https://app.glasinsight.com

# --- Generated on the server by bootstrap-server.sh (leave as they are) -----------
SECRET_KEY=
NEO4J_PASSWORD=
# Must stay equal to neo4j/<NEO4J_PASSWORD>; Neo4j reads it on first start only.
NEO4J_AUTH=

# --- LLM (required) ----------------------------------------------------------------
LLM_API_KEY=
LLM_BASE_URL=https://api.deepseek.com
LLM_MODEL_NAME=deepseek-flash

# --- Supabase: login and billing (required) ------------------------------------------
SUPABASE_URL=
SUPABASE_SERVICE_KEY=
SUPABASE_JWT_SECRET=
SUPABASE_ANON_KEY=
# The frontend build needs these two (public values, built into the page).
VITE_SUPABASE_URL=
VITE_SUPABASE_ANON_KEY=

# --- Optional ----------------------------------------------------------------------
STRIPE_SECRET_KEY=
STRIPE_WEBHOOK_SECRET=
RESEND_API_KEY=
SENTRY_DSN=
SENTRY_ENVIRONMENT=production
