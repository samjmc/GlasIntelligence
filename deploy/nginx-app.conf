# nginx inside the app container (Dockerfile.prod). Plain HTTP only: Caddy, in front,
# terminates TLS and proxies to this container on port 80 (see deploy/docker-compose.yml).
server {
    listen 80;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    # Caddy is the only client; trust its forwarded headers.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        client_max_body_size 50M;
    }
}
