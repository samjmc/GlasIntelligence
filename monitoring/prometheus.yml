global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: flask
    metrics_path: /api/metrics
    static_configs:
      - targets: ["glas-intelligence:5001"]
        labels:
          service: glas-api

  - job_name: node-exporter
    static_configs:
      - targets: ["glas-node-exporter:9100"]
        labels:
          service: host

  - job_name: cadvisor
    static_configs:
      - targets: ["glas-cadvisor:8080"]
        labels:
          service: containers

  - job_name: redis
    static_configs:
      - targets: ["glas-redis-exporter:9121"]
        labels:
          service: redis

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
