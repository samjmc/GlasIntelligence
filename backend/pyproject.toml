[project]
name = "glas-intelligence-backend"
version = "0.1.0"
description = "Glas Intelligence - Multi-agent AI prediction engine for scenario analysis"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Glas Intelligence" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "gunicorn>=23.0.0",
    
    # LLM
    "openai>=1.0.0",
    "duckduckgo-search>=8.1.1",

    # Zep Cloud
    "zep-cloud==3.28.0",
    
    # OASIS social simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",

    # Knowledge graph, self-hosted (GRAPH_BACKEND=graphiti): Graphiti on Neo4j, with a
    # local embedder. sentence-transformers is pinned to 3.0.0 by camel-oasis already.
    "graphiti-core==0.30.2",
    "sentence-transformers>=3.0.0,<4",

    # File processing
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Task queue
    "celery>=5.0.0",
    "redis>=5.0.0",
    
    # Auth / billing / email
    "supabase>=2.0.0",
    "PyJWT>=2.0.0",
    "stripe>=10.0.0",
    "resend>=2.0.0",
    "requests>=2.30.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pip-audit>=2.7.0",
    "sentry-sdk[flask]>=2.0.0",
    "prometheus-flask-exporter>=0.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pip-audit>=2.7.0",
]

[tool.uv]
# camel-oasis 0.2.5 pins neo4j==5.23.0 exactly; graphiti-core needs >=5.26. OASIS only
# imports neo4j for its optional backend="neo4j" agent graph, which we never enable.
# Measured 2026-09-24 (G0.5): full suite and an 8-round OASIS smoke pass on 5.28.6.
override-dependencies = ["neo4j>=5.26,<6"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    # UP042 would turn `class X(str, Enum)` into StrEnum. That is not a
    # mechanical change: format()/f-string output of the members differs.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
