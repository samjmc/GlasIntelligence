[project]
name = "glas-intelligence-backend"
version = "0.1.0"
description = "Glas Intelligence - Multi-agent AI prediction engine for scenario analysis"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Glas Intelligence" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "gunicorn>=23.0.0",
    
    # LLM
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.13.0",
    
    # OASIS social simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    "duckduckgo-search>=7.0",
    
    # File processing
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Task queue
    "celery>=5.0.0",
    "redis>=5.0.0",
    
    # Auth / billing / email
    "supabase>=2.0.0",
    "PyJWT>=2.0.0",
    "stripe>=10.0.0",
    "resend>=2.0.0",
    "requests>=2.30.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pip-audit>=2.7.0",
    "sentry-sdk[flask]>=2.0.0",
    "prometheus-flask-exporter>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E402",   # module-level import not at top (Flask pattern)
    "E501",   # line too long
    "E741",   # ambiguous variable name
    "I001",   # import sorting
    "W291",   # trailing whitespace
    "W292",   # no newline at end
    "W293",   # whitespace before ':'
    "F841",   # unused local variable (too noisy on existing code)
    "SIM102", # collapsible-if
    "SIM105", # suppressible-exception
    "SIM108", # if-else-block-instead-of-if-exp
    "SIM115", # open-file-with-context-handler
    "UP042",  # replace-str-enum
    "UP045",  # non-pep604-annotation
    "B007",   # unused-loop-control-variable
    "B023",   # function-uses-loop-variable
    "B904",   # raise-without-from-inside-except
    "E722",   # bare-except
    "SIM103", # needless-bool
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
