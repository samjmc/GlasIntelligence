name: Add Local SSH Key (one-time)

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: 87.99.135.45

jobs:
  add-key:
    name: Add SSH Key to Server
    runs-on: ubuntu-latest
    steps:
      - name: Append public key to authorized_keys
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC0xcNhbhVzb+NHfkXyHHiRE1aelqq9u0hOqPCvqiBxG sam@glasinsight-local" >> /root/.ssh/authorized_keys
            echo "Key added. Current authorized_keys count: $(wc -l < /root/.ssh/authorized_keys)"
