name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/glas-intelligence
  DEPLOY_HOST: 87.99.135.45
  DEPLOY_PATH: /opt/glas

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # github.sha is always set; meta "version" can be empty for some tag configs
      image_tag: ${{ github.sha }}
      full_image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Skipping migrations (secrets not configured)"
            exit 0
          fi
          supabase db push --project-ref "$SUPABASE_PROJECT_REF"
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + nginx files to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.staging.yml,nginx.conf,nginx/nginx-staging.conf"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            export DEPLOY_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_NAME="${{ env.IMAGE_NAME }}"
            # docker-compose.staging.yml uses ghcr.io/${GITHUB_REPOSITORY_OWNER:-glasinsight}/... — must match push owner
            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Free disk space BEFORE pull
            echo "Disk before cleanup:"
            df -h / | tail -1
            docker image prune -af --filter "until=24h" 2>/dev/null || true
            docker builder prune -af --filter "until=24h" 2>/dev/null || true
            echo "Disk after cleanup:"
            df -h / | tail -1

            docker pull ${REGISTRY}/${IMAGE_NAME}:${DEPLOY_TAG} || docker pull ${REGISTRY}/${IMAGE_NAME}:latest

            docker compose -f docker-compose.staging.yml up -d --pull always --force-recreate
            echo "Staging deployed with tag: ${DEPLOY_TAG}"

      - name: Smoke test staging
        run: |
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 5 https://staging.glasinsight.com/health 2>/dev/null; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Waiting for staging... ($i/30)"
            sleep 5
          done
          echo "Staging health check failed"
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Get current production image tag
        id: current
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          capture: true
          script: |
            docker inspect glas-intelligence --format='{{.Config.Image}}' 2>/dev/null || echo "none"

      - name: Copy compose + nginx files to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.staging.yml,nginx.conf,nginx/nginx-staging.conf"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"
            export DEPLOY_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            CURRENT_IMAGE=$(docker inspect glas-intelligence --format='{{.Config.Image}}' 2>/dev/null || echo "")
            echo "${CURRENT_IMAGE}" > /opt/glas/.rollback-image

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Free disk space BEFORE pull — old image layers stack up and fill the disk,
            # causing silent pull failures that fall back to cached old images.
            echo "Disk before cleanup:"
            df -h / | tail -1
            docker image prune -af --filter "until=24h" 2>/dev/null || true
            docker builder prune -af --filter "until=24h" 2>/dev/null || true
            echo "Disk after cleanup:"
            df -h / | tail -1

            docker compose -f docker-compose.prod.yml pull

            # Explicitly stop+remove the old containers (they may be managed by a stale
            # compose project and ignore --force-recreate). This is safe: data lives in
            # named volumes (redis_data) and bind mounts (./backend/uploads, /etc/letsencrypt).
            docker rm -f glas-intelligence glas-redis glas-celery-worker glas-sim-worker glas-research-worker glas-celery-beat 2>/dev/null || true

            docker compose -f docker-compose.prod.yml up -d
            echo "Production deployed with tag: ${DEPLOY_TAG}"

            # Verify what's actually running
            sleep 5
            RUNNING_IMAGE=$(docker inspect glas-intelligence --format='{{.Config.Image}}' 2>/dev/null || echo "unknown")
            RUNNING_DIGEST=$(docker inspect glas-intelligence --format='{{.Image}}' 2>/dev/null || echo "unknown")
            echo "Running image:  ${RUNNING_IMAGE}"
            echo "Running digest: ${RUNNING_DIGEST}"

      - name: Health check with auto-rollback
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            HEALTHY=false
            sleep 10
            for i in $(seq 1 24); do
              if docker exec glas-intelligence curl -sf --connect-timeout 5 http://127.0.0.1:5001/health > /dev/null 2>&1; then
                HEALTHY=true
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Health check attempt $i/24 failed, waiting 5s..."
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "HEALTH CHECK FAILED - initiating auto-rollback"
              ROLLBACK_IMAGE=$(cat /opt/glas/.rollback-image 2>/dev/null || echo "")

              if [ -n "$ROLLBACK_IMAGE" ] && [ "$ROLLBACK_IMAGE" != "none" ]; then
                echo "Rolling back to: ${ROLLBACK_IMAGE}"
                docker compose -f docker-compose.prod.yml down
                docker tag "${ROLLBACK_IMAGE}" glas-intelligence:rollback 2>/dev/null || true
                docker compose -f docker-compose.prod.yml up -d
                echo "Rollback completed"
              else
                echo "No rollback image available"
              fi
              exit 1
            fi

            echo "Production deployment verified"

      - name: Verify SSL
        if: success()
        run: |
          curl -sf https://glasinsight.com/health || echo "SSL check warning (may need DNS propagation)"
