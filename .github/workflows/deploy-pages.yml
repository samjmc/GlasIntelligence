name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grants the special Pages deployment token used by deploy-pages. This job
# only deploys the keyless static demo — no secrets, no .env, no backend.
permissions:
  contents: read
  pages: write
  id-token: write

# Deploys to the dedicated github-pages environment so the Pages URL shows up
# on the run page and in the repo's environments list.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy the static demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No secrets, no .env, no backend. If this build needs a credential,
      # the demo has stopped being keyless and this job should fail.
      # VITE_BASE points the bundle at the repo-site subpath (/GlasIntelligence/),
      # which is how GitHub Pages serves project sites.
      - name: Build the demo bundle
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_DEMO_MODE: '1'
          VITE_BASE: /GlasIntelligence/

      # SPA fallback: Pages serves 404.html for unknown paths (deep links).
      # .nojekyll stops Jekyll preprocessing of the artifact.
      - name: Add SPA fallback and .nojekyll
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
        working-directory: frontend

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        name: Deploy to Pages
        uses: actions/deploy-pages@v4
