name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-backend:
    name: Lint & Type Check (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check app/

      # Pre-existing formatting/type debt – warn-only until codebase is incrementally cleaned
      - name: Ruff format check (warn-only)
        run: uv run ruff format --check app/
        continue-on-error: true

      - name: Mypy type check (warn-only)
        run: uv run mypy app/ --ignore-missing-imports
        continue-on-error: true

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  test-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend
    env:
      ENABLE_REPORT_PAYLOAD_V1: "true"
      FLASK_DEBUG: "false"
      SECRET_KEY: "test-secret-key"
      # Placeholder values so app/services importing these at module load time don't bail in CI
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-service-key"
      SUPABASE_ANON_KEY: "placeholder-anon-key"
      LLM_API_KEY: "placeholder-llm-key"
      OPENAI_API_KEY: "placeholder-openai-key"
      ZEP_API_KEY: "placeholder-zep-key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-frontend:
    name: Unit Tests (Frontend)
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_DEBUG: "false"
      SECRET_KEY: "test-secret-key"
      ENABLE_REPORT_PAYLOAD_V1: "true"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder-service-key"
      SUPABASE_ANON_KEY: "placeholder-anon-key"
      LLM_API_KEY: "placeholder-llm-key"
      OPENAI_API_KEY: "placeholder-openai-key"
      ZEP_API_KEY: "placeholder-zep-key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=long

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --group dev

      - name: pip-audit (Python dependencies)
        run: cd backend && uv run pip-audit --strict --desc
        continue-on-error: true

      - name: npm audit (Frontend dependencies)
        run: cd frontend && npm ci && npm audit --audit-level=high
        continue-on-error: true

      - name: Gitleaks (secrets scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

  build-and-e2e:
    name: Build & E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: glas-intelligence:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services
        run: |
          docker compose -f docker-compose.ci.yml up -d
          sleep 10

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for app to start... ($i/30)"
            sleep 2
          done
          echo "Health check failed"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          cd e2e
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd e2e
          npx playwright test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    needs: build-and-e2e
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Build production image
        run: |
          docker build -f Dockerfile.prod \
            --build-arg VITE_SUPABASE_URL=https://placeholder.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=placeholder \
            -t glas-intelligence:scan .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: glas-intelligence:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
